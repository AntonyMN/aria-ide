name: Release & Multi-Platform Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds: .deb and .AppImage
          - platform: 'ubuntu-22.04'
            args: ''
          # Windows builds: .exe (NSIS) and .msi
          - platform: 'windows-latest'
            args: ''
          # macOS builds: .dmg and .app (Universal: Intel + Apple Silicon)
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build Desktop Installables
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: aria-ide-v__VERSION__
          releaseName: 'Aria IDE v__VERSION__'
          releaseBody: 'See the assets below to download the installable package for your operating system (.deb, .AppImage, .exe, or .dmg).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
